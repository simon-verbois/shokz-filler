[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shokz-refill"
version = "1.0.0"
description = "Load compatible MP3 music and audiobooks from YouTube Music, Audiobookshelf or local files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "mutagen>=1.47,<2",
  "requests>=2.32,<3",
  "piper-tts==1.8.0",
  "yt-dlp[default]>=2025.1.15",
  "ytmusicapi>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pyinstaller>=6.11",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.gui-scripts]
shokz-refill = "shokz_refill.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shokz_refill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shokz_refill"]
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["ytmusicapi.*", "yt_dlp.*", "mutagen.*", "piper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shokz_refill.metadata", "shokz_refill.tts_worker"]
disallow_untyped_calls = false
